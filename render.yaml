# Optional: Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: shop-intel-gateway
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APIFY_TOKEN
        sync: false
      - key: RAPIDAPI_PROXY_SECRET
        sync: false
